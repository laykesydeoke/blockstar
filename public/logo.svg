<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />
  <!-- Block grid pattern - 3x3 blocks representing blockchain -->
  <!-- Top row -->
  <rect x="128" y="108" width="72" height="72" rx="8" fill="white" opacity="0.95"/>
  <rect x="220" y="108" width="72" height="72" rx="8" fill="white" opacity="0.85"/>
  <rect x="312" y="108" width="72" height="72" rx="8" fill="white" opacity="0.95"/>
  <!-- Middle row -->
  <rect x="128" y="220" width="72" height="72" rx="8" fill="white" opacity="0.85"/>
  <!-- Center block - Star highlight -->
  <rect x="220" y="220" width="72" height="72" rx="8" fill="#070B1A"/>
  <polygon points="256,232 264,248 282,250 269,263 272,280 256,272 240,280 243,263 230,250 248,248" fill="white"/>
  <rect x="312" y="220" width="72" height="72" rx="8" fill="white" opacity="0.85"/>
  <!-- Bottom row -->
  <rect x="128" y="332" width="72" height="72" rx="8" fill="white" opacity="0.95"/>
  <rect x="220" y="332" width="72" height="72" rx="8" fill="white" opacity="0.85"/>
  <rect x="312" y="332" width="72" height="72" rx="8" fill="white" opacity="0.95"/>
</svg>
